{% extends 'layouts/auth.html' %}

{% block title %}Check your inbox | Ziuza Marketplace{% endblock %}

{% block content %}
<div class="w-full max-w-md mx-auto">
    <div class="bg-white rounded-2xl border border-gray-100 shadow-xl shadow-stone-200/60 p-6 sm:p-8 text-center">
        <h1 class="auth-display auth-title text-gray-900">Check your inbox</h1>
        <p class="auth-subtitle mt-2 mb-5">
            If an account exists for that email, a password reset link is on its way.
            The link expires in 3 days.
        </p>
        <a href="{% url 'accounts:login' %}"
           class="auth-button inline-block w-full py-2.5 px-4 rounded-xl text-white bg-[#008751] hover:bg-[#0A7D53] transition-all font-semibold">
            Back to sign in
        </a>
    </div>
</div>
{% endblock %}
