<div id="buyer-order-status-header"
     {% if order.payment_status == 'pending' or order.payment_status == 'processing' or order.fulfillment_status == 'unfulfilled' or order.fulfillment_status == 'processing' %}
     hx-get="{% url 'orders:buyer_status_partial' order.public_number %}"
     hx-trigger="every 10s"
     hx-swap="outerHTML"
     {% endif %}>
    <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
            <h2 class="text-xl font-display font-bold text-kenya-black flex items-center gap-2">
                {{ order.public_number }}
                {% if order.payment_status == 'pending' or order.payment_status == 'processing' %}
                <span class="inline-flex items-center gap-1 rounded-full bg-amber-50 px-2.5 py-0.5 text-xs font-semibold text-amber-700 border border-amber-200 animate-pulse">
                    <span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>
                    Live Updates Active
                </span>
                {% endif %}
            </h2>
            <p class="text-sm text-gray-500 mt-0.5">
                {{ order.created_at|date:"M j, Y H:i" }} ·
                <span class="font-medium text-gray-800">Payment:</span> {{ order.get_payment_status_display }} ·
                <span class="font-medium text-gray-800">Fulfillment:</span> {{ order.get_fulfillment_status_display }}
            </p>
        </div>
    </div>
</div>
