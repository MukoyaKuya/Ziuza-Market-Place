[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ziuza"
version = "0.1.0"
description = "Multi-vendor marketplace celebrating Kenyan creators, artisans, and producers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "django-environ>=0.11.0",
    "django-unfold>=0.100.0",
    "django-ninja>=1.3.0,<2.0",
    "psycopg[binary]>=3.1.0",
    "pillow>=10.0.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=4.1.0",
]
prod = [
    "redis>=5.0.0",
    "sentry-sdk[django]>=2.0.0",
    "gunicorn>=22.0.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--strict-markers -v --ds=config.settings.test"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]
exclude = ["tests*"]
