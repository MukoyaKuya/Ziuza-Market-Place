{# Usage: {% include 'components/button/button.html' with label="Shop Now" variant="red" icon="true" size="md" %} #}
<button type="{{ type|default:'button' }}"
        class="{% if variant == 'red' %}btn-red
               {% elif variant == 'outline-green' %}btn-outline-green
               {% elif variant == 'pill-white' %}btn-pill-white
               {% elif variant == 'secondary' %}btn-secondary
               {% elif variant == 'ghost' %}btn-ghost
               {% else %}btn-primary{% endif %}
               {% if size == 'sm' %}btn-sm{% elif size == 'lg' %}btn-lg{% endif %}
               {{ extra_classes }}"
        {% if disabled or loading %}disabled{% endif %}
        {% if loading %}aria-busy="true"{% endif %}>
    {% if loading %}
    <svg class="mr-2 h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
    </svg>
    {% endif %}
    <span>{{ label }}</span>
    {% if icon and not loading %}
    <svg class="ml-2 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
    </svg>
    {% endif %}
</button>
