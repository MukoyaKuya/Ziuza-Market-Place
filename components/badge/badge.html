{# Usage: {% include 'components/badge/badge.html' with label="Verified Seller" variant="green" %} #}
<span class="inline-flex items-center space-x-1 px-2.5 py-0.5 rounded-full text-xs font-bold tracking-wide
            {% if variant == 'green' %}bg-kenya-green-subtle text-kenya-green
            {% elif variant == 'red' %}bg-kenya-red-subtle text-kenya-red
            {% elif variant == 'black' %}bg-kenya-black text-white
            {% elif variant == 'gold' %}bg-amber-100 text-amber-900
            {% else %}bg-gray-100 text-gray-800{% endif %} {{ extra_classes }}">
    {% if icon == 'verified' %}
    <svg class="w-3 h-3 text-kenya-green fill-current" viewBox="0 0 20 20">
        <path d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
    </svg>
    {% endif %}
    <span>{{ label }}</span>
</span>
