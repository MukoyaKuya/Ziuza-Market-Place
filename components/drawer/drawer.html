{# Alpine drawer. Open via @open-drawer.window or show_trigger="true". #}
<div
    x-data="{ open: false }"
    @open-drawer.window="open = true"
    @keydown.escape.window="open = false"
    class="relative z-50"
>
    {% if show_trigger %}
    <button type="button" class="btn-secondary" @click="open = true">{{ trigger_label|default:'Open drawer' }}</button>
    {% endif %}

    <div
        x-show="open"
        x-cloak
        x-transition.opacity.duration.200ms
        class="fixed inset-0 bg-kenya-black/50"
        @click="open = false"
        aria-hidden="true"
    ></div>

    <aside
        x-show="open"
        x-cloak
        x-transition:enter="transform transition ease-out duration-300"
        x-transition:enter-start="{% if side == 'left' %}-translate-x-full{% else %}translate-x-full{% endif %}"
        x-transition:enter-end="translate-x-0"
        x-transition:leave="transform transition ease-in duration-200"
        x-transition:leave-start="translate-x-0"
        x-transition:leave-end="{% if side == 'left' %}-translate-x-full{% else %}translate-x-full{% endif %}"
        class="fixed inset-y-0 {% if side == 'left' %}left-0{% else %}right-0{% endif %} z-10 w-full max-w-md bg-white shadow-ziuza-lg border-{% if side == 'left' %}r{% else %}l{% endif %} border-brand-surface-border flex flex-col"
        role="dialog"
        aria-modal="true"
        aria-labelledby="drawer-title"
    >
        <div class="flex items-center justify-between gap-3 px-5 py-4 border-b border-brand-surface-border">
            <h2 id="drawer-title" class="text-lg font-display font-bold text-kenya-black">{{ title|default:'Panel' }}</h2>
            <button type="button" class="btn-icon" @click="open = false" aria-label="Close panel">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-5 text-sm text-gray-700">
            {{ content|default:'Drawer content goes here.' }}
        </div>
        {% if footer %}
        <div class="border-t border-brand-surface-border px-5 py-4">
            {{ footer }}
        </div>
        {% endif %}
    </aside>
</div>
