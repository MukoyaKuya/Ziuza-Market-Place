{# Usage: {% include 'components/textarea/textarea.html' with name="bio" label="About" rows="4" %} #}
<div class="w-full {{ wrapper_classes }}">
    {% if label %}
    <label for="{{ id|default:name }}" class="field-label">
        {{ label }}{% if required %}<span class="text-kenya-red" aria-hidden="true"> *</span>{% endif %}
    </label>
    {% endif %}
    <textarea
        id="{{ id|default:name }}"
        name="{{ name }}"
        rows="{{ rows|default:'4' }}"
        placeholder="{{ placeholder|default:'' }}"
        class="field-textarea {% if error %}field-input-error{% endif %} {{ extra_classes }}"
        {% if required %}required{% endif %}
        {% if disabled %}disabled{% endif %}
        {% if error %}aria-describedby="{{ id|default:name }}-error" aria-invalid="true"{% elif hint %}aria-describedby="{{ id|default:name }}-hint"{% endif %}
    >{{ value|default:'' }}</textarea>
    {% if error %}
    <p id="{{ id|default:name }}-error" class="field-error" role="alert">{{ error }}</p>
    {% elif hint %}
    <p id="{{ id|default:name }}-hint" class="field-hint">{{ hint }}</p>
    {% endif %}
</div>
