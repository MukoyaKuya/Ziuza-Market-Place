{# Usage: {% include 'components/skeleton/skeleton.html' with variant="card" %} #}
{% if variant == 'text' %}
<div class="space-y-2 {{ extra_classes }}" aria-hidden="true">
    <div class="skeleton h-4 w-3/4"></div>
    <div class="skeleton h-4 w-full"></div>
    <div class="skeleton h-4 w-5/6"></div>
</div>
{% elif variant == 'avatar' %}
<div class="skeleton h-10 w-10 rounded-full {{ extra_classes }}" aria-hidden="true"></div>
{% elif variant == 'list' %}
<div class="space-y-4 {{ extra_classes }}" aria-hidden="true">
    {% for i in "123" %}
    <div class="flex gap-3">
        <div class="skeleton h-12 w-12 rounded-ziuza shrink-0"></div>
        <div class="flex-1 space-y-2">
            <div class="skeleton h-3 w-1/2"></div>
            <div class="skeleton h-3 w-full"></div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
{# card #}
<div class="rounded-2xl border border-brand-surface-border bg-white p-4 {{ extra_classes }}" aria-hidden="true">
    <div class="skeleton aspect-[4/3] w-full rounded-ziuza"></div>
    <div class="mt-4 space-y-2">
        <div class="skeleton h-4 w-3/4"></div>
        <div class="skeleton h-4 w-1/2"></div>
        <div class="skeleton h-5 w-1/3 mt-3"></div>
    </div>
</div>
{% endif %}
<span class="sr-only">Loading</span>
