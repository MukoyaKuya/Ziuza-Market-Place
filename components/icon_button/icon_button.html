{# Usage: {% include 'components/icon_button/icon_button.html' with label="Close" icon="close" %} #}
<button
    type="{{ type|default:'button' }}"
    class="btn-icon {% if size == 'sm' %}p-1.5{% elif size == 'lg' %}p-3{% endif %} {{ extra_classes }}"
    {% if disabled %}disabled{% endif %}
    aria-label="{{ label }}"
    {% if title %}title="{{ title }}"{% else %}title="{{ label }}"{% endif %}
>
    {% if icon == 'close' %}
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
    {% elif icon == 'menu' %}
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
    {% elif icon == 'heart' %}
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 016.364 0L12 7.636l1.318-1.318a4.5 4.5 0 116.364 6.364L12 20.364l-7.682-7.682a4.5 4.5 0 010-6.364z" />
    </svg>
    {% elif icon == 'cart' %}
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 9m12-9l2 9m-9-4h4" />
    </svg>
    {% else %}
    <span class="text-sm font-bold" aria-hidden="true">{{ icon|default:'•' }}</span>
    {% endif %}
</button>
