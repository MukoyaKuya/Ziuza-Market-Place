{# Alpine.js Toast Notification Component — listens for window `toast` events / HX-Trigger #}
<div x-data="{ toasts: [] }"
 @toast.window="toasts.push({ id: Date.now(), message: $event.detail.message, type: $event.detail.type || 'info' }); setTimeout(() => toasts.shift(), 4000)"
 class="fixed bottom-5 right-5 z-[60] space-y-3 max-w-sm w-full pointer-events-none"
 aria-live="polite">
 <template x-for="toast in toasts" :key="toast.id">
 <div x-transition:enter="ease-out duration-300"
 x-transition:enter-start="opacity-0 translate-y-2"
 x-transition:enter-end="opacity-100 translate-y-0"
 x-transition:leave="ease-in duration-200"
 x-transition:leave-start="opacity-100"
 x-transition:leave-end="opacity-0"
 class="pointer-events-auto p-4 rounded-2xl shadow-ziuza-lg border flex items-center justify-between text-sm font-semibold text-white"
 :class="{
 'bg-kenya-green': toast.type === 'success',
 'bg-kenya-red': toast.type === 'error',
 'bg-kenya-black': toast.type !== 'success' && toast.type !== 'error'
 }">
 <span x-text="toast.message"></span>
 <button type="button" @click="toasts = toasts.filter(t => t.id !== toast.id)" class="ml-3 text-white/60 hover:text-white" aria-label="Dismiss"></button>
 </div>
 </template>
</div>
